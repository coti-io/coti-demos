name: Deploy Payroll

# Builds the hrpayroll TanStack Start app (prerendered to static HTML) and publishes
# it to S3 (optionally invalidating CloudFront). Runs only when the hrpayroll app or
# this workflow changes, so the other demos in the monorepo don't trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'hrpayroll/**'
      - '.github/workflows/deploy-payroll.yml'
  workflow_dispatch:

# One deploy at a time; cancel an in-progress run when a newer commit lands.
concurrency:
  group: deploy-payroll
  cancel-in-progress: true

defaults:
  run:
    working-directory: hrpayroll

jobs:
  build-and-deploy:
    name: Build & deploy to S3
    runs-on: ubuntu-latest
    environment: payroll-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hrpayroll/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public, baked into the bundle at build time (GitHub Actions "Variables").
          # Required for the WalletConnect connector; injected wallets work without it.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        # Prerendering emits one HTML file per route under dist/client. Long-cache the
        # fingerprinted assets; never cache the HTML entrypoints so a new deploy is
        # picked up immediately.
        run: |
          aws s3 sync dist/client/ "s3://${{ vars.PAYROLL_S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync dist/client/ "s3://${{ vars.PAYROLL_S3_BUCKET }}" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        if: ${{ vars.PAYROLL_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.PAYROLL_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
