name: Deploy Payroll

# Builds the hrpayroll TanStack Start app (prerendered to static HTML) and publishes
# it to S3 (optionally invalidating CloudFront). Runs only when the hrpayroll app or
# this workflow changes, so the other demos in the monorepo don't trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'hrpayroll/**'
      - '.github/workflows/deploy-payroll.yml'
  workflow_dispatch:

# One deploy at a time; cancel an in-progress run when a newer commit lands.
concurrency:
  group: deploy-payroll
  cancel-in-progress: true

defaults:
  run:
    working-directory: hrpayroll

jobs:
  build-and-deploy:
    name: Build & deploy to S3
    runs-on: ubuntu-latest
    environment: payroll-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which is what package-lock.json is generated with.
          # On Node 22 (npm 10) the lockfile resolves to a different tree and `npm ci`
          # fails with "Missing: idb-keyval@... from lock file".
          node-version: 24
          cache: npm
          cache-dependency-path: hrpayroll/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public, baked into the bundle at build time (GitHub Actions "Variables").
          # Optional: enables the WalletConnect connector; injected wallets (MetaMask
          # etc.) work without it. Resolves to empty until the variable is configured.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        # Prerendering emits one HTML file per route under dist/client. Long-cache the
        # fingerprinted assets; never cache the HTML entrypoints so a new deploy is
        # picked up immediately. The bucket name is trimmed because a stray trailing
        # newline in the variable value broke the s3:// URL in a previous run.
        env:
          BUCKET_NAME: ${{ vars.BUCKET_NAME }}
        run: |
          BUCKET="$(printf '%s' "$BUCKET_NAME" | tr -d '[:space:]')"
          aws s3 sync dist/client/ "s3://$BUCKET" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync dist/client/ "s3://$BUCKET" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        # The distribution id is stored as an environment secret (AWS_DISTRIBUTION_ID).
        # Passed via env and checked in bash so the step skips gracefully if unset.
        # Trimmed like BUCKET_NAME above: a stray newline in the secret value makes
        # CloudFront report NoSuchDistribution for an otherwise valid id.
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_DISTRIBUTION_ID }}
        run: |
          DIST_ID="$(printf '%s' "$DISTRIBUTION_ID" | tr -d '[:space:]')"
          if [ -z "$DIST_ID" ]; then
            echo "AWS_DISTRIBUTION_ID not set; skipping CloudFront invalidation."
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
